name: Build Real Web-to-APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova & Build Android App
        run: |
          npm install -g cordova
          cordova create bdu_app com.bdu.premium "BDU Premium"
          cd bdu_app
          cordova platform add android
          rm -rf www/*
          cp -r ../public/* www/
          cordova build android --debug

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdu-premium-app
          path: bdu_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
